[package]
name = "yapk-next"
version = "0.1.0"
description = "Yet Another Password Keeper - Next Generation"
authors = ["xsddz"]
edition = "2021"
license = "MIT"

[lib]
name = "yapk_next_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
dirs = "5"
thiserror = "1"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
